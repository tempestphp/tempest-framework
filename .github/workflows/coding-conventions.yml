name: Coding Conventions

on:
  push:
    branches: [3.x]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-style:
    name: Run style check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction  --ignore-platform-reqs

      - name: Run Mago
        run: |
          composer fmt -- --check
          composer lint -- --reporting-format=github

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run fmt:check

  phpstan:
    name: "Run static analysis: PHPStan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Restore PHPStan result cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/phpstan
          key: "phpstan-result-cache-${{ github.run_id }}"
          restore-keys: |
            phpstan-result-cache-

      - name: Run PHPStan
        run: vendor/bin/phpstan --error-format=github -vv 

      - name: Save PHPStan result cache
        uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: .cache/phpstan
          key: "phpstan-result-cache-${{ github.run_id }}"

