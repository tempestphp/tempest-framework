name: Integration Tests

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/**"
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  POSTGRES_USER: runner
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: postgres

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover-domains:
    name: "Discover Integration Domains"
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.scan.outputs.domains }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Scan Integration directories
        id: scan
        run: |
          php -r '
            $domains = [];
            foreach (glob("tests/Integration/*", GLOB_ONLYDIR) as $dir) {
                $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($dir));
                foreach ($it as $file) {
                    if (str_ends_with($file->getFilename(), "Test.php")) {
                        $domains[] = basename($dir);
                        break;
                    }
                }
            }
            sort($domains);
            echo "domains=" . json_encode(array_values(array_unique($domains))) . "\n";
          ' >> $GITHUB_OUTPUT


  vitest:
    runs-on: ubuntu-latest
    name: "Run JS tests"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, pcntl, fileinfo, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, intl, ftp, zip
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build
        run: bun run build

      - name: Run tests
        run: bun run test

  phpunit:
    needs: discover-domains
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.5]
        database: [sqlite]
        stability: [prefer-stable]
        domain: ${{ fromJson(needs.discover-domains.outputs.domains) }}
        include:
          - os: ubuntu-latest
            php: 8.5
            database: mysql
            stability: prefer-stable
            domain: Database
          - os: ubuntu-latest
            php: 8.5
            database: postgres
            stability: prefer-stable
            domain: Database

    name: "${{ matrix.domain }} (PHP ${{ matrix.php }} - ${{ matrix.database }})"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, pcntl, fileinfo, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, intl, ftp, zip
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --ignore-platform-reqs
        
      - name: Warm Up TypePHP Cache
        run: php vendor/bin/typephp cache:warm

      - name: "Setup Redis"
        if: ${{ matrix.domain == 'Cache' || matrix.domain == 'Framework' }}
        uses: supercharge/redis-github-action@1.8.1

      - name: "Setup MySQL"
        if: ${{ matrix.database == 'mysql' }}
        uses: ankane/setup-mysql@v1
        with:
          mysql-version: 8.0
          database: "app"

      - name: "Setup PostgreSQL"
        if: ${{ matrix.database == 'postgres' }}
        uses: ankane/setup-postgres@v1

      - name: Create worker databases - mysql
        if: ${{ matrix.database == 'mysql' }}
        run: for i in 1 2 3 4; do mysql -u root -e "CREATE DATABASE IF NOT EXISTS app$i;"; done

      - name: Create worker databases - postgres
        if: ${{ matrix.database == 'postgres' }}
        run: for i in 1 2 3 4; do createdb "${POSTGRES_DB}$i"; done

      - name: Set database config - ${{ matrix.database }}
        run: php -r "copy('tests/Fixtures/Config/database.${{ matrix.database }}.php', 'tests/Fixtures/Config/database.config.php');"

      - name: Tempest about
        run: php ./tempest about -v

      - name: List discovered locations
        run: php ./tempest discovery:status

      - name: Execute domain tests
        run: php -d"error_reporting = E_ALL & ~E_DEPRECATED" -dmemory_limit=2G vendor/bin/paratest --runner WrapperRunner --processes 4 tests/Integration/${{ matrix.domain }}