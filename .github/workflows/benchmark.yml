name: Benchmark

on:
  pull_request:
    paths:
      - 'tests/Benchmark/**'
      - 'packages/container/src/**'
      - 'packages/core/src/**'
      - 'packages/discovery/src/**'
      - 'packages/router/src/**'
      - 'packages/http/src/**'
      - 'packages/view/src/**'
      - 'packages/clock/src/**'
      - 'packages/console/src/**'
      - 'packages/database/src/**'
      - 'packages/event-bus/src/**'
      - 'packages/reflection/src/**'
      - 'phpbench.json'
      - '.github/workflows/benchmark.yml'

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: ${{ github.event.pull_request.base.ref == github.event.repository.default_branch }}
    name: Performance Regression Check
    runs-on: ubuntu-latest
    
    # Disable TypePHP completely for phpbench runs
    env:
      TYPEPHP_DISABLE: "true"

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --quiet

      - name: Benchmark base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          cp .env.example .env
          sed -i 's/^INTERNAL_CACHES=.*/INTERNAL_CACHES=false/' .env
          sed -i 's/^DISCOVERY_CACHE=.*/DISCOVERY_CACHE=false/' .env
          composer update --no-interaction --prefer-dist --quiet
          vendor/bin/phpbench run --tag=base --store --progress=none

      - name: Benchmark PR branch
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          cp .env.example .env
          sed -i 's/^INTERNAL_CACHES=.*/INTERNAL_CACHES=false/' .env
          sed -i 's/^DISCOVERY_CACHE=.*/DISCOVERY_CACHE=false/' .env
          composer update --no-interaction --prefer-dist --quiet
          vendor/bin/phpbench run --tag=pr --store --ref=base --report=aggregate --progress=none --output=benchmark-comment | tee benchmark-result.txt || true

      - name: Prepare artifact
        run: |
          mkdir -p benchmark-artifact
          cp benchmark-result.txt benchmark-artifact/
          echo "${{ github.event.pull_request.number }}" > benchmark-artifact/pr-number.txt
          echo "${{ github.head_ref }}" > benchmark-artifact/head-ref.txt
          echo "${{ github.base_ref }}" > benchmark-artifact/base-ref.txt
          echo "${{ github.event.pull_request.base.sha }}" > benchmark-artifact/base-sha.txt
          echo "${{ github.event.pull_request.head.sha }}" > benchmark-artifact/head-sha.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: benchmark-artifact/
          retention-days: 1